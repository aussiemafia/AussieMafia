<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aussie Mafia | Live Map</title>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    .map-live-info {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 0 0 18px;
    }

    .map-live-info .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .map-frame-wrap {
      position: relative;
      width: 100%;
      min-height: 720px;
      overflow: hidden;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
    }

    .map-frame {
      display: block;
      width: 100%;
      height: 78vh;
      min-height: 720px;
      border: 0;
      background: #111;
    }

    .map-loading {
      padding: 34px 20px;
      text-align: center;
    }

    .map-actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .map-fallback {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 800px) {
      .map-frame-wrap,
      .map-frame {
        min-height: 560px;
        height: 70vh;
      }
    }
  </style>
</head>

<body>

  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="aussie-mafia-background.mp4" type="video/mp4">
    </video>
  </div>

  <header class="topbar">
    <div class="wrap nav">

      <div class="brand">
        <img src="aussie-mafia-logo.png.png" alt="Aussie Mafia">
      </div>

      <nav class="navlinks">
        <a href="index.html">HOME</a>
        <a href="map.html">MAP</a>
        <a href="index.html#server">SERVER</a>
        <a href="index.html#rules">RULES</a>
        <a href="vip.html" class="vip">VIP</a>
      </nav>

    </div>
  </header>

  <main class="map-page">
    <div class="wrap">

      <div class="section-head">
        <div>
          <div class="eyebrow">CURRENT WIPE</div>
          <h2 id="map-title">Aussie Mafia Live Map</h2>
        </div>
      </div>

      <div class="map-live-info">
        <span class="badge" id="map-status">CHECKING CURRENT MAP...</span>
        <span class="badge" id="map-size" style="display:none"></span>
        <span class="badge" id="map-seed" style="display:none"></span>
      </div>

      <div class="map-panel">
        <div class="map-frame-wrap" id="map-container">
          <div class="map-loading" id="map-loading">
            Loading the current Aussie Mafia map from the live server information...
          </div>
        </div>

        <div class="map-actions">
          <a class="btn primary" id="open-rustmaps" href="https://www.battlemetrics.com/servers/rust/40453506" target="_blank" rel="noopener noreferrer">
            OPEN CURRENT MAP ↗
          </a>
        </div>
      </div>

    </div>
  </main>

  <script>
    async function loadCurrentMap() {
      try {
        const response = await fetch(`map-data.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Map data returned ${response.status}`);

        const current = await response.json();
        const seed = Number(current.seed);
        const size = Number(current.size);

        if (!Number.isSafeInteger(seed) || !Number.isSafeInteger(size) || seed < 0 || size <= 0) {
          throw new Error('The current map seed or size is invalid');
        }

        const rustMapsUrl = current.mapUrl || `https://rustmaps.com/map/${size}_${seed}`;
        const updatedAt = current.updatedAt ? new Date(current.updatedAt) : null;

        titleEl.textContent = 'Current Aussie Mafia Map';
        statusEl.textContent = updatedAt && !Number.isNaN(updatedAt.valueOf())
          ? `CURRENT MAP · CHECKED ${updatedAt.toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Australia/Brisbane' })} AEST`
          : 'CURRENT AUSSIE MAFIA MAP';
        sizeEl.textContent = `SIZE ${size}`;
        seedEl.textContent = `SEED ${seed}`;
        sizeEl.style.display = 'inline-flex';
        seedEl.style.display = 'inline-flex';
        openMapButton.href = rustMapsUrl;

        container.innerHTML = `
          <iframe
            class="map-frame"
            src="${rustMapsUrl}"
            title="Aussie Mafia current Rust map"
            loading="eager"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>`;
      } catch (error) {
        console.error('Could not load the current map:', error);
        showFallback('CURRENT MAP DATA TEMPORARILY UNAVAILABLE');
      }
    }


  </script>

</body>
</html>
