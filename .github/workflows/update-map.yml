name: Update Aussie Mafia Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Download current Rust map
        env:
          RUSTMAPS_API_KEY: ${{ secrets.RUSTMAPS_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          SIZE = "3500"
          SEED = "1752646769"

          url = f"https://api.rustmaps.com/v4/maps/{SIZE}/{SEED}?staging=false"

          request = urllib.request.Request(
              url,
              headers={
                  "X-API-Key": os.environ["RUSTMAPS_API_KEY"],
                  "Content-Type": "application/json"
              }
          )

          print(f"Requesting Rust map {SIZE}_{SEED}...")

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          image_url = data.get("imageUrl")

          if not image_url:
              raise Exception("RustMaps did not return an imageUrl")

          print("Map image found:", image_url)

          with urllib.request.urlopen(image_url) as response:
              image = response.read()

          with open("current-map.jpg", "wb") as f:
              f.write(image)

          print("Saved current-map.jpg")
          PY

      - name: Update map page
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("map.html")
          html = path.read_text(encoding="utf-8")

          html = re.sub(
              r'<img[^>]+class="current-map"[^>]*>',
              '<img class="current-map" src="current-map.jpg" alt="Current Aussie Mafia Rust Map">',
              html
          )

          if 'class="current-map"' not in html:
              html = re.sub(
                  r'<div class="map-panel">.*?</div>',
                  '''<div class="map-panel">
            <img class="current-map" src="current-map.jpg" alt="Current Aussie Mafia Rust Map">
          </div>''',
                  html,
                  count=1,
                  flags=re.DOTALL
              )

          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit updated map
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain current-map.jpg)" ]; then
            echo "No map changes detected."
            exit 0
          fi

          git config user.name "Aussie Mafia Map Bot"
          git config user.email "actions@github.com"

          git add map.html current-map.jpg
          git commit -m "Update current Rust map"
          git push
